# Modelled on the Bareos default configuration (see LICENSING.md).
# test/test_auth.sh rewrites this file with the real path of test/bareos-dir.d/tls.
Director {
  Name = "bareos-dir"
  QueryFile = "/usr/lib/bareos/scripts/query.sql"
  Maximum Concurrent Jobs = 10
  Password = "DIRECTOR_PASSWORD"
  Messages = "Daemon"
  Auditing = yes
  DIRport = 19101
  TLS Enable = yes
  TLS Require = no
  TLS CA Certificate File = "/path/to/onesimus/test/bareos-dir.d/tls/ca.pem"
  TLS Certificate = "/path/to/onesimus/test/bareos-dir.d/tls/server.pem"
  TLS Key = "/path/to/onesimus/test/bareos-dir.d/tls/server.key"
}
