# Console configuration for Legacy mode (no TLS)
# Copy to: /etc/bareos/bareos-dir.d/console/onesimus-legacy.conf

Console {
  Name = onesimus-legacy
  Password = "onesimus-test-password-not-secret"

  CommandACL = *all*
  ClientAcl = *all*
  JobAcl = *all*
  StorageAcl = *all*
  ScheduleAcl = *all*
  PoolAcl = *all*
  FileSetAcl = *all*
  CatalogAcl = *all*

  # Legacy mode: No TLS
  TLS Enable = no
  TLS Require = no
}
