# Release packages for a version tag (vX.Y.Z or vX.Y.Z-rc.N).
#
#   1. check:   the tag must match project(onesimus VERSION X.Y.Z) in
#               CMakeLists.txt, otherwise nothing is built.
#   2. linux:   .deb (./deploy.sh package) and AppImage (./deploy.sh appimage)
#               in a Debian 13 container (distribution Qt 6.8 with QtGrpc).
#   3. windows: MSI (deploy.ps1 installer) and portable ZIP (deploy.ps1 zip).
#               oconsole/ofd go into the MSI when a Windows build of
#               onesimus-dird is given (see "onesimus-dird input" below);
#               without it the MSI holds the GUI only.
#   4. macos:   Onesimus-<version>-macos-arm64.dmg (+ .sha256) through
#               scripts/ci/macos-package.sh: Onesimus.app with the Qt
#               frameworks, signed with the hardened runtime, notarised and
#               stapled - as far as the secrets below are set.
#   5. release: SHA256SUMS over all files, then a DRAFT GitHub Release for the
#               tag with everything attached. The maintainer reviews and
#               publishes it by hand.
#
# macOS signing secrets (repository secrets, passed only to the packaging
# step of the macos job):
#   MACOS_CERTIFICATE_P12_BASE64  "Developer ID Application" certificate with
#                                 its private key as .p12, base64 -w0 (create
#                                 the .p12 with legacy encryption, see
#                                 BUILD_OSX.md, or the keychain refuses it)
#   MACOS_CERTIFICATE_PASSWORD    password of that .p12
#   MACOS_SIGN_IDENTITY           optional; default: the first "Developer ID
#                                 Application" identity of the certificate
#   APPSTORE_API_KEY_ID           App Store Connect API key for notarytool:
#   APPSTORE_API_ISSUER_ID          key ID, issuer ID and the AuthKey_<id>.p8
#   APPSTORE_API_KEY_P8_BASE64      file, base64 -w0
# No certificate: the dmg is only signed ad hoc and not notarised; certificate
# without API key: signed, not notarised. Both cases print a warning.
#
# onesimus-dird input (optional): a URL of onesimus-dird-<ver>-windows-x86_64.zip
# plus its SHA-256, from the workflow_dispatch inputs or, for a tag push, from
# the repository variables DIRD_WINDOWS_ZIP_URL and DIRD_WINDOWS_ZIP_SHA256.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v1.0.0)'
        required: true
      dird_zip_url:
        description: 'URL of onesimus-dird-<version>-windows-x86_64.zip (optional)'
        required: false
        default: ''
      dird_zip_sha256:
        description: 'SHA-256 of that zip (required with the URL)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  # Never cancel a release half way; a second run waits.
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  QT_VERSION: '6.8.3'
  OPENSSL_CACHE_REV: '1'

jobs:
  check:
    name: Tag matches project version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Compare tag and CMakeLists.txt
        id: version
        run: scripts/ci/check-tag-version.sh "$TAG"

  linux:
    name: Linux packages (.deb, AppImage)
    needs: check
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 90
    env:
      ONESIMUS_ALLOW_ROOT: '1'
      BUILD_DIR: build
      GENERATOR: Ninja
      OPENSSL_INSTALL_DIR: /opt/ci-cache/openssl
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git curl zstd file perl make build-essential cmake ninja-build \
            dpkg-dev librsvg2-bin \
            qt6-base-dev qt6-base-private-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            qt6-grpc-dev qt6-grpc-tools qt6-wayland protobuf-compiler libprotobuf-dev libgl-dev libsecret-1-dev pkgconf

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Fetch submodules (openssl, proto)
        id: sub
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 external/openssl proto
          echo "openssl=$(git rev-parse HEAD:external/openssl)" >> "$GITHUB_OUTPUT"

      # Same key as ci.yml: a release reuses the OpenSSL that CI built.
      - name: Cache static OpenSSL
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/ci-cache/openssl
          key: openssl-${{ env.OPENSSL_CACHE_REV }}-debian13-${{ steps.sub.outputs.openssl }}

      - name: .deb
        run: JOBS="$(nproc)" ./deploy.sh package

      - name: AppImage
        run: JOBS="$(nproc)" ./deploy.sh appimage

      - name: Collect
        run: |
          mkdir -p out
          cp build/*.deb dist/appimage/*.AppImage out/
          ls -la out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-linux
          path: out/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows packages (MSI, ZIP)
    needs: check
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      BUILD_DIR: build
      DIRD_ZIP_URL: ${{ inputs.dird_zip_url || vars.DIRD_WINDOWS_ZIP_URL }}
      DIRD_ZIP_SHA256: ${{ inputs.dird_zip_sha256 || vars.DIRD_WINDOWS_ZIP_SHA256 }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Fetch submodules (openssl, proto)
        id: sub
        run: |
          git submodule update --init --depth 1 external/openssl proto
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "openssl=$(git rev-parse HEAD:external/openssl)" >> $env:GITHUB_OUTPUT
          "OPENSSL_INSTALL_DIR=$env:RUNNER_TEMP\ci-cache\openssl" >> $env:GITHUB_ENV

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtgrpc
          cache: true

      - name: Install protoc and NASM
        run: |
          $tools = "$env:RUNNER_TEMP\tools"
          $downloads = @(
            @{ Url = 'https://github.com/protocolbuffers/protobuf/releases/download/v28.3/protoc-28.3-win64.zip'
               Sha = 'ce64f49bdeddef49ce4bd313a8f59bcf92fcf67b5831efbf66170386d2e66948'; Dir = 'protoc'; Bin = 'bin' },
            @{ Url = 'https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip'
               Sha = '3ee4782247bcb874378d02f7eab4e294a84d3d15f3f6ee2de2f47a46aa7226e6'; Dir = 'nasm'; Bin = 'nasm-2.16.03' }
          )
          foreach ($d in $downloads) {
            $zip = "$env:RUNNER_TEMP\$($d.Dir).zip"
            Invoke-WebRequest -Uri $d.Url -OutFile $zip
            $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
            if ($hash -ne $d.Sha) { throw "SHA-256 mismatch for $($d.Url): $hash" }
            Expand-Archive -Path $zip -DestinationPath "$tools\$($d.Dir)"
            "$tools\$($d.Dir)\$($d.Bin)" >> $env:GITHUB_PATH
          }

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 6.0.2
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Cache static OpenSSL
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\ci-cache\openssl
          key: openssl-${{ env.OPENSSL_CACHE_REV }}-windows2022-msvc-${{ steps.sub.outputs.openssl }}

      # Optional: the Windows build of onesimus-dird (another repository,
      # another team). Checked against its SHA-256; skipped when no URL is set.
      - name: Fetch onesimus-dird for Windows
        run: |
          if (-not $env:DIRD_ZIP_URL) {
            Write-Host '::notice title=MSI::No onesimus-dird Windows zip given - the MSI holds the GUI only.'
            exit 0
          }
          if (-not $env:DIRD_ZIP_SHA256) { throw 'dird zip URL given without its SHA-256' }
          $name = Split-Path ([uri]$env:DIRD_ZIP_URL).AbsolutePath -Leaf
          if ($name -notmatch '^onesimus-dird-.+-windows-x86_64\.zip$') { throw "unexpected file name: $name" }
          New-Item -ItemType Directory -Force -Path dist\rust | Out-Null
          Invoke-WebRequest -Uri $env:DIRD_ZIP_URL -OutFile "dist\rust\$name"
          $hash = (Get-FileHash -Algorithm SHA256 "dist\rust\$name").Hash.ToLower()
          if ($hash -ne $env:DIRD_ZIP_SHA256.ToLower()) { throw "SHA-256 mismatch for ${name}: $hash" }
          Write-Host "onesimus-dird: $name ($hash)"

      # package-msi.ps1 picks the zip up from dist\rust\.
      - name: MSI
        run: .\deploy.ps1 installer -QtPath $env:QT_ROOT_DIR -BuildDir $env:BUILD_DIR

      # After the MSI: package-windows.ps1 writes into build\deploy, which
      # the MSI harvests.
      - name: Portable ZIP
        run: .\deploy.ps1 zip -QtPath $env:QT_ROOT_DIR -BuildDir $env:BUILD_DIR -Version '${{ needs.check.outputs.version }}'

      - name: Collect
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item build\Onesimus-*-windows-x86_64.msi, build\Onesimus-*-windows-x86_64.msi.sha256 out\
          Copy-Item build\deploy\Onesimus-*-Windows.zip out\
          Get-ChildItem out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-windows
          path: out/*
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS package (dmg)
    needs: check
    runs-on: macos-15
    timeout-minutes: 120
    env:
      BUILD_DIR: build
      GENERATOR: Ninja
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Fetch submodules (openssl, proto)
        id: sub
        run: |
          git submodule update --init --depth 1 external/openssl proto
          echo "openssl=$(git rev-parse HEAD:external/openssl)" >> "$GITHUB_OUTPUT"
          echo "OPENSSL_INSTALL_DIR=$RUNNER_TEMP/ci-cache/openssl" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtgrpc
          cache: true

      - name: Install ninja and protoc
        run: brew install ninja protobuf

      # Same key as ci.yml: a release reuses the OpenSSL that CI built.
      - name: Cache static OpenSSL
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-cache/openssl
          key: openssl-${{ env.OPENSSL_CACHE_REV }}-macos15-arm64-mt12-${{ steps.sub.outputs.openssl }}

      - name: Build
        run: CMAKE_PREFIX_PATH="$QT_ROOT_DIR" JOBS="$(sysctl -n hw.ncpu)" ./deploy.sh build

      # The only step that sees the secrets.
      - name: Package, sign and notarise
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: OUT_DIR=out scripts/ci/macos-package.sh build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-macos
          path: out/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft GitHub Release
    needs: [check, linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job that writes: it creates the release and uploads assets.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * | grep -v ' SHA256SUMS$' > SHA256SUMS
          cat SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          flags=(--draft --verify-tag --title "Onesimus ${TAG#v}" --generate-notes)
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run: replace the assets, but only of a release that is
            # still a draft - a published release is never changed here.
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" != "true" ]; then
              echo "::error::Release $TAG is already published; not touching it."
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" "${flags[@]}" dist/*
          fi
          echo "Draft release for $TAG (project version $VERSION) is ready for review."
