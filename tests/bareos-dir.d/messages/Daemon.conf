Messages {
  Name = Daemon
  Description = "Message delivery for daemon messages (no job)."
  mailcommand = "/usr/bin/bsmtp -h localhost -f \"\(Bareos\) \<%r\>\" -s \"Bareos daemon message\" %r"
  mail = root = all, !skipped, !audit
  console = all, !skipped, !saved, !audit
  append = "/tmp/bareos-dir-work/bareos.log" = all, !skipped, !audit
  append = "/tmp/bareos-dir-work/bareos-audit.log" = audit
}
